<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FF6B00">
<title>Sem conexão · Comprei Barato</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#16162A;padding:24px;box-sizing:border-box}
  .c{max-width:360px;text-align:center;background:#fff;border:1px solid #EDE6DF;border-radius:22px;padding:28px 22px}
  img{height:40px}
  h1{font-size:22px;margin:16px 0 6px}
  p{color:#5A5A72;font-size:15px;line-height:1.5;margin:0 0 18px}
  button{background:#FF6B00;color:#fff;border:0;border-radius:14px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer;width:100%}
</style>
</head>
<body>
  <div class="c">
    <img src="/logo.png" alt="Comprei Barato">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, é só tocar no botão. Seus pedidos e acessos continuam salvos na sua conta.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
